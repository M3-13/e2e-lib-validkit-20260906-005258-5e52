[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "validkit"
version = "0.1.0"
description = "Kleine, abhängigkeitsfreie Python-Bibliothek für Prüf- und Normalisierungsfunktionen"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[tool.setuptools.packages.find]
include = ["validkit*"]

[tool.setuptools.package-data]
validkit = ["py.typed"]
